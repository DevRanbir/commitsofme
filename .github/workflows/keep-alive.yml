name: Keep Alive Ping

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest

    steps:
      - name: Ping Sites
        run: |
          urls=(
            "https://rootlynk.itsranbir.me"
            "https://itsranbir.me"
            "https://dsa.itsranbir.me"
            "https://gitto.itsranbir.me/"
            "https://gittolinkedin-63830034108.europe-west1.run.app/"
          )

          for url in "${urls[@]}"; do
            echo "Pinging $url"
            curl -L --max-time 20 "$url"
            sleep 5
          done
